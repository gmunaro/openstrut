# Publica o OpenStrut V2 no GitHub Pages (https://gmunaro.github.io/openstrut/)
# a cada push na main: verifica (typecheck, lint, formatação, testes), gera o
# build com a base /openstrut/ e faz o deploy.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; o que está em andamento termina
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      # base /openstrut/ e 404.html = index.html (recarregar uma rota interna abre o app)
      - run: bun run build:pages
        env:
          # importação pelo Google Drive (docs/GOOGLE-DRIVE.md); vazias, a opção fica desabilitada
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
