SISTRUT=PARAMETRIZACAO UTILIZADA - NOME DO ARQUIVO PARAMETRIZACAO DEFAULT
C:\=DRIVE E DIRETORIO DEFAULT PARA OS ARQUIVOS DE VIGAS (.VIG .SEC .FOR )
C:\SISTRUT\EXEC40\=DRIVE E DIRETORIO DEFAULT PARA OS ARQUIVOS DE PARAMETRIZACAO (.DSP)
C:\=DRIVE E DIRETORIO DEFAULT PARA OS ARQUIVOS DE VIGAS EDITADAS (.EDV)
C:\=DRIVE E DIRETORIO DEFAULT PARA OS ARQUIVOS PADRAO CAD (.DXF ou .PUB)
m=UNIDADE DE MEDIDA LINEAR
t=UNIDADE DE FORCA
1=COEFICIENTE MULTIPLICADOR DA UNIDADE DE MEDIDA PARA TRANSFORMAR EM METROS
1=COEFICIENTE MULTIPLICADOR DA UNIDADE DE FORCA PARA TRANSFORMAR EM TONELADAS
CHR$(27)+CHR$(50)=ESPACAMENTO DEFAULT DA IMPRESSORA - 1/6"
CHR$(27)+CHR$(48)=ESPACAMENTO DE IMPRESSAO - 1/8"
CHR$(27)+CHR$(78)+CHR$(6)=NUMERO DE LINHAS PULADAS NO PICOTE - DEFAULT 6
CHR$(27)+CHR$(79)=ANULA O PULO DO PICOTE ACIMA DEFINIDO - USADO EM GRAFICO

Atencao !!!
Altere somente os valores que se encontram a esquerda do sinal = .
Caso esteja com o sistema implantado em winchester, e conveniente alaterar o
drive configurado para C e para o seu diretorio de trabalho (C:\SISTRUT\=...).

Caso a parametrizacao utilizada na edicao das vigas seja diferente da SISTRUT,
e necessario que se indique o drive e diretorio onde se encontra este arquivo.
Altere entao inicialmente a parametrizacao na forma
SISTRUT=......    passa a ser   NovoNome=PARAMETRIZACAO UTILIZADA ...
e altere tambem o drive e diretorio onde ela se encontra
C:\SISTRUT\EXEC40\=DRIVE E DIRETORIO DEFAULT ..... PARAMETRIZACAO (.DSP)
