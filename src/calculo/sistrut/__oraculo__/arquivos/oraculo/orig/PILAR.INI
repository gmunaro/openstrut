1.4=COEFICIENTE DE SEGURANCA DO CONCRETO
1.15=COEFICIENTE DE SEGURANCA DO ACO
CHR$(27)+CHR$(50)=ESPACAMENTO DEFAULT DA IMPRESSORA - 1/6"
CHR$(27)+CHR$(48)=ESPACAMENTO DE IMPRESSAO - 1/8"
CHR$(27)+CHR$(78)+CHR$(6)=NUMERO DE LINHAS PULADAS NO PICOTE - DEFAULT 6
CHR$(27)+CHR$(79)=ANULA O PULO DO PICOTE ACIMA DEFINIDO - USADO EM GRAFICO

Atencao !!!
Altere somente os valores que se encontram a esquerda do sinal = .
Caso esteja com o sistema implantado em winchester, e conveniente alaterar o
drive configurado para C (C=...) e alterar o diretorio default para o diretorio
de trabalho (\SISTRUT\=...) .
Caso a parametrizacao utilizada para o calculo e detalhamento de colunas de
Edificio seja diferente da SISTRUT, e necessario que se indique o drive e o
diretorio onde se encontra este arquivo.
Altere entao inicialmente a parametrizacao na forma
SISTRUT=......    passa a ser   NovoNome=PARAMETRIZACAO UTILIZADA ...
e altere tambem o drive e diretorio onde ela se encontra
C:\SISTRUT\EXEC40\=DRIVE E DIRETORIO DEFAULT ..... PARAMETRIZACAO (.PIP)

