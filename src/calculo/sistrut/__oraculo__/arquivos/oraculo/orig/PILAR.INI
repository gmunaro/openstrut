15=NUMERO MAXIMO DE VARIACOES DE ARMADURA EM UMA COLUNA
m=UNIDADE DE MEDIDA LINEAR
t=UNIDADE DE FORCA
1=COEFICIENTE MULTIPLICADOR DA UNIDADE DE MEDIDA PARA TRANSFORMAR EM METROS
1=COEFICIENTE MULTIPLICADOR DA UNIDADE DE FORCA PARA TRANSFORMAR EM TONELADAS
t/cm2=UNIDADE DE GRANDEZA PARA Fck E Fyk
1=COEFICIENTE MULTIPLICADOR DA UNIDADE DE Fck E Fyk PARA TRANSFORMAR EM T/C2
0.15=RESISTENCIA CARACTERISTICA DO CONCRETO - Fck
5.0=RESISTENCIA CATACTERISTICA DO ACO - Fyk
B=TIPO DE ACO (A/B)
DIAMETRO EM MILIMETROS DAS BITOLAS UTILIZADAS (UTILIZAR SEMPRE 13 BITOLAS)
