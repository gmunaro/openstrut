2=EM CENTIMETROS  MINIMA EXCENTRICIDADE ACIDENTAL A SER COMPARADA COM H/30
S=VERIFICO MINIMA EXCENTRICIDADE ACIDENTAL DE H/30
I=NA VERIFICACAO AS EXCENTRICIDADES ACIDENTAIS SERAO  <I>SOLADAS <S>IMULTANEAS
S=CONSIDERO SECOES RETANGULARES E CIRCULARES SIMETRICAS NA VERIFICACAO
