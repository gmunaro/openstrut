AREA EM CENTIMETROS QUADRADOS DAS BITOLAS ACIMA CONFIGURADAS (MESMA ORDEM)
0.08 , 0.125 , 0.2 , 0.315 , 0.5 , 0.8 , 1.25 , 2 , 3.15 , 3.88 , 5 , 8 , 12.5
